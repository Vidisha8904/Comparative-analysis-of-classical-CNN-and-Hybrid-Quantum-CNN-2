# Phase 5 multi-seed base model comparison: re-run of configs/base/classical_subset.yaml
# with training_seed=44 (data_seed unchanged at 42). Everything else is
# identical to the Phase 1 parent config -- see section 12 of the build spec.

data_seed: 42   # fixed across every phase -- controls which images subsample_per_class picks
training_seed: 44   # Phase 5 multi-seed sweep point (data_seed stays 42)

dataset:
  classes: [0, 1, 2]
  samples_per_class_train: 300
  samples_per_class_test: 100
  data_root: "data"

training:
  batch_size: 32
  epochs: 15
  learning_rate: 0.001
  optimizer: adam
  checkpoint_every_n_batches: null
  resume_from_checkpoint: null
  max_batches: null

model:
  num_classes: 3

output_dir: "results/multiseed/classical_subset_seed44"
